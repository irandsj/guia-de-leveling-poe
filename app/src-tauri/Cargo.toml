[package]
name = "guia-leveling"
version = "0.1.2"
description = "Guia de leveling em overlay para Path of Exile 1"
edition = "2021"
publish = false

[workspace]
members = ["leitor-log", "arvore-visao"]

[lib]
name = "guia_leveling"
path = "src/lib.rs"

[[bin]]
name = "guia-leveling"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arvore-visao = { path = "arvore-visao" }
leitor-log = { path = "leitor-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
ureq = "2"

[target.'cfg(windows)'.dependencies.jpeg-encoder]
version = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# A conta em cima da foto (achar a árvore de passivas) é o único trecho pesado do guia:
# compila pra velocidade, e também nos testes e no "tauri dev".
[profile.release.package.arvore-visao]
opt-level = 3

[profile.dev.package.arvore-visao]
opt-level = 3
